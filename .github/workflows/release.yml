name: Release

# Publishes a GitHub release (and its tag) for the manifest version when
# that version reaches main and hasn't been released yet. HACS offers
# releases as updates.
on:
  push:
    branches:
      - main
    paths:
      - custom_components/blackbird4/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/blackbird4/manifest.json'))['version'])")
          tag="v${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released"
            exit 0
          fi
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${tag}" --generate-notes
